version: "1.0"
name: "Python Development Environment Test"

env:
  PYTHON_VERSION: "3"
  PROJECT_NAME: "ml-test"

jobs:
  python-setup:
    steps:
      - name: "Check Python"
        description: "Check pre-installed Python"
        run: |
          echo "=== Python Installation ==="
          python3 --version
          pip3 --version
          echo "=== Python Path ==="
          which python3
          which pip3

      - name: "Install Python Packages"
        description: "Install common Python packages"
        run: |
          echo "Installing Python development packages..."
          pip3 install --upgrade pip
          pip3 install numpy pandas matplotlib scikit-learn requests

      - name: "Create Virtual Environment"
        description: "Set up Python virtual environment"
        run: |
          cd /opt/topi-dev
          echo "Creating virtual environment..."
          python3 -m venv ${PROJECT_NAME}-env
          source ${PROJECT_NAME}-env/bin/activate
          
          echo "=== Virtual Environment Info ==="
          which python
          python --version
          
          # Install packages in venv
          pip install flask pytest black

      - name: "Create Python Project"
        description: "Create a sample Python application"
        run: |
          cd /opt/topi-dev
          mkdir -p ${PROJECT_NAME}
          cd ${PROJECT_NAME}
          
          # Create main application
          cat > app.py << 'EOF'
          import os
          import sys
          import numpy as np
          
          def main():
              print(f"Python version: {sys.version}")
              print(f"NumPy version: {np.__version__}")
              print(f"Build ID: {os.environ.get('TOPI_BUILDID', 'N/A')}")
              print(f"Workspace: {os.environ.get('TOPI_WORKSPACE', 'N/A')}")
              
              # Simple computation
              arr = np.array([1, 2, 3, 4, 5])
              print(f"Array mean: {arr.mean()}")
              
          if __name__ == "__main__":
              main()
          EOF
          
          # Create requirements.txt
          cat > requirements.txt << 'EOF'
          numpy>=1.20.0
          pandas>=1.3.0
          matplotlib>=3.4.0
          scikit-learn>=0.24.0
          requests>=2.26.0
          EOF
          
          # Run the application
          python3 app.py

      - name: "Test Installation"
        description: "Verify all packages work correctly"
        run: |
          cd /opt/topi-dev/${PROJECT_NAME}
          
          # Test script
          cat > test_imports.py << 'EOF'
          print("Testing package imports...")
          try:
              import numpy
              print("✓ NumPy imported successfully")
              import pandas
              print("✓ Pandas imported successfully")
              import matplotlib
              print("✓ Matplotlib imported successfully")
              import sklearn
              print("✓ Scikit-learn imported successfully")
              import requests
              print("✓ Requests imported successfully")
              print("\nAll packages imported successfully!")
          except ImportError as e:
              print(f"✗ Import failed: {e}")
              exit(1)
          EOF
          
          python3 test_imports.py

      - name: "Complete"
        uses: "echo"
        params:
          message: "Python environment setup complete! Project: ${PROJECT_NAME}"