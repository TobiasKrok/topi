apiVersion: v1
kind: ConfigMap
metadata:
  name: test-workflow-abc123
  namespace: topi-builds
data:
  workflow.yaml: |
    version: "1.0"
    name: "Example Build Workflow"

    env:
      BUILD_ENV: "development"
      DEBUG: "true"

    jobs:
      build:
        steps:
          - name: "Echo Start"
            description: "Print build start message"
            uses: "echo"
            params:
              message: "Starting build process in workspace: ${TOPI_WORKSPACE}"
          - name: "Checkout"
            uses: "git/checkout"
          - name: "Run script"
            run: |
              cd $TOPI_WORKSPACE
              echo "In workspace: $TOPI_WORKSPACE"
              chmod +x test.sh
              ./test.sh
          - name: "Setup go"
            uses: "setup/go"
          - name: "Check version"
            run: |
              go version
