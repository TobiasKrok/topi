apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: topi-system
  labels:
    app: buildkit
    topi.io/component: builder
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
  # For local development with Kind, use the default storage class
  # For production, specify your storage class:
  # storageClassName: your-storage-class
