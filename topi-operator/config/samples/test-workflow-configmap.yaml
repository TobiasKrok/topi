apiVersion: v1
kind: ConfigMap
metadata:
  name: test-workflow-abc123
  namespace: topi-builds
data:
  workflow.yaml: |
    version: "1.0"
    name: "Example Build Workflow"

    env:
      BUILD_ENV: "development"
      DEBUG: "true"

    jobs:
      build:
        steps:
          - name: "Echo Start"
            description: "Print build start message"
            uses: "echo"
            params:
              message: "Starting build process in workspace: ${TOPI_WORKSPACE}"
          - name: "Checkout"
            uses: "git/checkout"
          - name: "Setup Node"
            uses: "setup/node"
          - name: "Install and build"
            run: |
              npm install
              npm run build
          - name: "Upload MinIO"
            uses: "artefact/minio"
            params:
              source: ${TOPI_WORKSPACE}/dist
